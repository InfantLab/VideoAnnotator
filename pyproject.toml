[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "videoannotator"
version = "1.5.0"
description = "A modern, modular toolkit for analyzing, processing, and visualizing human interaction videos"
readme = "README.md"
license = "MIT"
authors = [
    {name = "VideoAnnotator Team", email = "info@videoannotator.com"}
]
maintainers = [
    {name = "Caspar Addyman", email = "addyman@sun.ac.za"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.12,<3.14"
dependencies = [
    # Core: what the server, CLI, registry, storage and exporters import, plus what
    # FastAPI needs by name. Pipeline libraries live in the extras below.
    # Removed in v1.6.0 because nothing in the package used them (spec 013):
    # moviepy, matplotlib, tqdm, openpyxl, pandas, imageio, imageio-ffmpeg, av,
    # alembic, rich, click (typer brings it), scikit-image, cryptography; numba moved
    # to the `audio` extra.
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # FastAPI needs it for form/file uploads (job submission); never imported directly.
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "typer>=0.9.0",
    "numpy>=2.0",
    "Pillow>=10.4.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "packaging>=21.0",
    "psutil>=5.9.0",
    "pycocotools>=2.0.10",
    "webvtt-py>=0.5.1",
    "praatio>=6.2.0",
    "pyjwt>=2.10.1",
    # No cv2 here: every extras group that uses OpenCV either forces plain
    # `opencv-python` transitively (deepface/retina-face for `face`, ultralytics for
    # `person`) or declares it directly (`scene`, `face-openface3`, `llm`). Declaring
    # opencv-python-headless in core as well put both variants, which share the `cv2`
    # namespace, in every face/person install and corrupted the module depending on
    # install order (github.com/opencv/opencv-python#note-1).
]

[project.optional-dependencies]
# Per-pipeline-family extras (004-extras-based-install). Core install (no extras)
# pulls in none of these; a pipeline whose extras group isn't installed is
# omitted from registry listings with an actionable install hint rather than
# crashing (see src/videoannotator/registry/pipeline_loader.py).
#
# `torch`/`torchvision`/`torchaudio` are pinned identically (==2.6.0/==0.21.0)
# across every group below so combining extras (e.g. `[scene,person]` or
# `[all]`) resolves to one consistent install rather than conflicting pins.
face = [
    # DeepFace-only variant — the one face extras group with no torch dependency.
    # cv2 comes transitively via deepface/retina-face's own unconditional
    # `opencv-python` dependency, but neither pins an upper bound, so we do:
    # opencv-python 5.0 removed cv2.CascadeClassifier and all Haar-cascade data
    # entirely (replaced by the DNN-based FaceDetectorYN) — face_pipeline.py's
    # "opencv" backend still uses the legacy API, so an unpinned install breaks
    # at runtime with `AttributeError: module 'cv2' has no attribute
    # 'CascadeClassifier'`, not at install time. Migrating to FaceDetectorYN is
    # real follow-up work, not a pyproject fix.
    "opencv-python>=4.11.0.86,<5.0",
    "deepface>=0.0.91",
    # deepface's retinaface detector backend requires tf-keras alongside
    # Keras-3-era tensorflow (tensorflow itself is deepface's transitive dep,
    # not declared here directly); without it, importing face_pipeline raises
    # ValueError at import time, not just at inference time.
    "tf-keras>=2.15.0",
]
face-openface3 = [
    # ==, not >=: every later release pins Pillow==9.4.0 (no Python 3.12 wheel,
    # so it builds from source and fails without libjpeg headers) plus an
    # exact numpy.
    "openface-test==0.1.13",
    # openface-test imports these without declaring them. They used to arrive with
    # core (scikit-image, pandas) or another extra (torch), so this group alone failed
    # with "No module named 'torch'" (found 2026-10-01, spec 013).
    "torch>=2.11,<2.12",
    "torchvision>=0.26,<0.27",
    "scikit-image>=0.25.2",
    "pandas>=2.2.2",
    "timm>=1.0",
    "huggingface-hub>=0.20.0,<1.0",
    "tqdm>=4.65.0",
    # Imported at module level by OpenFace's STAR landmark detector (lib/utils,
    # conf), though inference doesn't plot or log.
    "matplotlib>=3.9.2",
    "seaborn>=0.13",
    "tensorboardX>=2.6",
    "scipy>=1.11.0",
    # openface3_pipeline.py imports cv2 directly and openface-test itself
    # declares no opencv dependency of its own — unlike `face`/`person`,
    # nothing here pulls it in transitively. <5.0: see `face` group's comment
    # re: opencv-python 5.0 dropping cv2.CascadeClassifier.
    "opencv-python>=4.11.0.86,<5.0",
]
audio = [
    "torch>=2.11,<2.12",
    "librosa>=0.10.0",
    # whisper_base_pipeline configures numba's threading layer for librosa.
    "numba>=0.60.0",
    # sdist-only release; built from source at install (see tool.uv.extra-build-dependencies)
    "openai-whisper>=20250625",
    # Defensive upper bounds on the whole pyannote.* family: pyannote.audio
    # 3.3.2 itself declares its own pyannote.core/database/metrics/pipeline
    # deps unbounded too, so pinning only pyannote.audio wouldn't stop e.g.
    # pyannote.core alone drifting to its own next major. Majors are pinned
    # explicitly because unqualified `uv lock --upgrade` has broken this project
    # before (open-clip-torch 3.1, opencv-python 5.0; see CHANGELOG). The
    # pyannote.audio 4 migration lifts these (v1.6.0 spec 3).
    # torch stays at 2.11: pyannote.audio 4 imports torchaudio, whose last release
    # (2.11, now discontinued) is compiled against torch 2.11 and fails to load on
    # anything newer. Lift when pyannote.audio drops torchaudio.
    "torchaudio>=2.11,<2.12",
    # torchcodec (pyannote.audio 4's audio decoder) is compiled per torch release;
    # 0.11.x is torch 2.11's. A newer one fails to load ("torchcodec is not
    # installed correctly"). Our pipeline passes audio in memory, so decoding
    # doesn't depend on it, but it should import cleanly.
    "torchcodec>=0.11,<0.12",
    "pyannote.audio>=4.0.7,<5",
]
scene = [
    "torch>=2.11,<2.12",
    "open-clip-torch>=2.24.0",
    # scenedetect itself has no unconditional opencv dependency (only via its
    # own `[opencv]`/`[opencv-headless]` extras, which we don't use — see
    # research.md §1/T030 history), but scene_pipeline.py calls cv2.VideoCapture
    # directly, so this group needs its own cv2. Not headless: standardizing on
    # plain opencv-python project-wide, since `face`/`person` force it
    # transitively anyway and mixing variants corrupts the shared `cv2`
    # namespace (see core dependencies comment).
    "scenedetect>=0.6.3",
    # <5.0: see `face` group's comment re: opencv-python 5.0 dropping
    # cv2.CascadeClassifier (scene_pipeline.py doesn't use it, but pinning
    # keeps every group on the same resolved opencv-python version).
    "opencv-python>=4.11.0.86,<5.0",
]
person = [
    "torch>=2.11,<2.12",
    "torchvision>=0.26,<0.27",
    # cv2 comes transitively via ultralytics/supervision's own unconditional
    # `opencv-python` dependency, uncapped by either — pin the ceiling
    # explicitly here too; see `face` group's comment re: opencv-python 5.0.
    "opencv-python>=4.11.0.86,<5.0",
    "ultralytics>=8.3.0",
    # ByteTrack (person_tracking's tracker) imports `lap`; ultralytics doesn't
    # declare it and pip-installs it at runtime instead, which fails offline.
    "lap>=0.5.12",
]
llm = [
    # vlm_annotation pipeline talks to a locally-hosted Ollama server. httpx
    # is already a core dependency (used for the ollama package's own HTTP
    # transport); this group needs nothing beyond the `ollama` client itself.
    "ollama>=0.4",
    # cv2 is used for frame sampling (cv2.VideoCapture), same as `scene`.
    "opencv-python>=4.11.0.86,<5.0",
]
all = [
    "videoannotator[face,face-openface3,audio,scene,person,llm]"
]

[tool.setuptools.package-data]
# registry/metadata/*.yaml: the pipeline registry is fully metadata-driven as of
# 004-extras-based-install (LEGACY_MAPPINGS/_infer_module_path removed in T013) —
# without these YAMLs bundled, a real (non-editable) install resolves zero
# pipelines regardless of which extras are installed.
videoannotator = ["viewer_static/**/*", "registry/metadata/*.yaml"]

[project.urls]
Homepage = "https://github.com/InfantLab/VideoAnnotator"
Documentation = "https://github.com/InfantLab/VideoAnnotator/wiki"
Repository = "https://github.com/InfantLab/VideoAnnotator"
Issues = "https://github.com/InfantLab/VideoAnnotator/issues"

[project.scripts]
# Entry point for the CLI application
videoannotator = "videoannotator.cli:app"

[tool.uv]
# uv-native config - empty is fine for now

[tool.uv.extra-build-dependencies]
openai-whisper = ["setuptools", "wheel"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# CUDA wheels only exist for Linux/Windows; restrict the cu124 index to Linux
# so macOS and other platforms resolve torch from PyPI (CPU build).
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 88  # Keep existing Black line length for consistency
lint.select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
lint.ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module-import-not-at-top (common in conditional/ML imports)
    "SIM102", # collapsible-if (stylistic)
    "SIM105", # use contextlib.suppress (stylistic)
    "SIM108", # if-else-block-instead-of-if-exp (stylistic)
    "SIM115", # open-file-with-context-handler (stylistic)
    "SIM117", # multiple-with-statements (stylistic)
    "SIM118", # in-dict-keys (stylistic)
    "RUF001", # ambiguous-unicode-character (false positives in strings)
    "RUF005", # collection-literal-concatenation (stylistic)
    "RUF013", # implicit-optional (common in ML code)
    "RUF022", # unsorted-dunder-all (low value)
    "RUF059", # unused-unpacked-variable (common in tuple unpacking)
    "UP042",  # str+Enum -> StrEnum changes str()/format() of members, which can change serialized output
]
target-version = "py312"

# Per-file exceptions:
# - API modules use FastAPI dependency injection (B008 is expected)
# - batch_orchestrator has a valid Optional default pattern (RUF013)
[tool.ruff.lint.per-file-ignores]
"src/videoannotator/api/**/*.py" = ["B008"]
"src/videoannotator/cli.py" = ["B008", "B904"]
"src/videoannotator/batch/batch_orchestrator.py" = ["RUF013"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
check_untyped_defs = false
disallow_any_generics = false  # Relaxed for ML dependencies
disallow_incomplete_defs = false
no_implicit_optional = false

# The whole package is type-checked; only non-package directories are excluded.
exclude = [
    "examples/",
    "scripts/",
]

[[tool.mypy.overrides]]
module = [
    "tests.api.*",
    "tests.integration.test_api_integration",
]
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (cross-component)",
    "pipeline: Full pipeline tests (slow)",
    "performance: Performance and benchmark tests",
    "experimental: Experimental and research tests",
    "slow: Tests that take >10 seconds",
    "gpu: Tests requiring GPU acceleration",
    "real_models: Tests using real ML models",
    "meta: marks tests as meta-tests for testing test infrastructure",
    "asyncio: marks tests as requiring asyncio support",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*_test.py",
    "*/examples/*",
    "*/scripts/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]
branch = true
parallel = false

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if 0:",
    "if False:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.paths]
source = [
    "src/",
    "*/site-packages/",
]

[dependency-groups]
dev = [
    "docformatter>=1.7.7",
    "httpx>=0.28.1",
    "libcst>=1.8.5",
    "mypy>=1.5.0",
    "pre-commit>=4.3.0",
    "pytest>=8.3.2",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.14.0",
    "types-PyYAML>=6.0.0",
    "types-requests>=2.31.0",
]
# The docker-compose Jupyter service: `uv sync --group notebooks`.
notebooks = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
]

[[tool.mypy.overrides]]
module = [
    "cv2",
    "whisper",
    "pyannote.*",
    "ultralytics",
    "sentence_transformers",
    "librosa",
    "scenedetect.*",
    "transformers",
    "torch",
    "torchvision",
    "torchaudio",
    "timm",
    "dlib",
    "datasets",
    "openai",
    "huggingface_hub",
    "accelerate",
    "plotly.*",
    "seaborn",
    "networkx",
    "open_clip_torch",
    "sqlalchemy",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Examples are not part of the core package
module = "examples.*"
ignore_errors = true

[[tool.mypy.overrides]]
# Scripts are utilities, not core package code
module = "scripts.*"
ignore_errors = true
