name: audio_processing
display_name: Whisper + pyannote (deprecated)
title: "Speech and speakers (deprecated)"
summary: >-
  Transcribes speech and says who spoke when, in one step. Use Speech and Speaker turns instead.
homepage: https://github.com/openai/whisper
benchmarks: []
quality_note: >-
  Deprecated: see Speech and Speaker turns for their benchmarks.
description: Transcribe speech with Whisper (faster-whisper) and perform speaker diarization using pyannote.audio producing WebVTT + RTTM outputs.
pipeline_family: audio
variant: whisper-pyannote
# Short name 'audio' resolves here while this pipeline exists (spec 014).
family_default: true
# Duplicates speech_recognition + speaker_diarization (pipeline review, v1.6.0).
# Kept running for existing configs; not listed; removed in v1.7.0.
deprecated:
  removal_version: "1.7.0"
  replacement: [speech_recognition, speaker_diarization]
module_path: videoannotator.pipelines.audio_processing:AudioPipeline
requires_extras: [audio]
tasks:
  - speech-transcription
  - speaker-diarization
modalities:
  - audio
capabilities:
  - streaming
  - embedding
outputs:
  - format: WebVTT
    types: [transcript]
    file: speech_recognition.vtt
  - format: RTTM
    types: [speaker_turns]
    file: speaker_diarization.rttm
config_schema:
  whisper_model:
    group: technical
    label: "Whisper model size"
    type: string
    default: large-v3-turbo
    description: Whisper model (faster-whisper size name)
  min_speakers:
    group: behavioural
    label: "Fewest speakers"
    unit: speakers
    min: 1
    type: integer
    default: 1
    description: Minimum number of speakers to consider
  max_speakers:
    group: behavioural
    label: "Most speakers"
    unit: speakers
    min: 1
    type: integer
    default: 10
    description: Maximum number of speakers to consider
examples:
  - cli: videoannotator job submit demo.mp4 --pipelines audio_processing
    description: Submit audio processing job
version: 1
stability: beta
backends:
  - ctranslate2
  - pytorch

# spec 011: diarization (on by default) needs a HF token + licences; see speaker_diarization.yaml.
requires_setup:
  - kind: secret
    name: HUGGINGFACE_TOKEN
    aliases: [HF_AUTH_TOKEN, HF_TOKEN]
    description: A Hugging Face access token (to download the pyannote models)
    help_url: https://huggingface.co/settings/tokens
  - kind: licence
    name: pyannote/speaker-diarization-community-1
    description: Accept the pyannote/speaker-diarization-community-1 licence on Hugging Face, with the same account as the token.
    help_url: https://huggingface.co/pyannote/speaker-diarization-community-1
weights:
  - id: mobiuslabsgmbh/faster-whisper-large-v3-turbo
    approx_mb: 1622
    cache: huggingface
  - id: pyannote/speaker-diarization-community-1
    approx_mb: 34
    cache: huggingface

# spec 025: cited by the methods paragraph (videoannotator export methods).
citations:
  - key: radford2023whisper
    bibtex: |
      @inproceedings{radford2023whisper,
        author = {Radford, Alec and Kim, Jong Wook and Xu, Tao and Brockman, Greg and McLeavey, Christine and Sutskever, Ilya},
        title = {Robust Speech Recognition via Large-Scale Weak Supervision},
        booktitle = {Proceedings of the 40th International Conference on Machine Learning},
        series = {Proceedings of Machine Learning Research},
        volume = {202},
        pages = {28492--28518},
        year = {2023}
      }
  - key: plaquet2023powerset
    bibtex: |
      @inproceedings{plaquet2023powerset,
        author = {Plaquet, Alexis and Bredin, Herv{\'e}},
        title = {Powerset multi-class cross entropy loss for neural speaker diarization},
        booktitle = {Proc. INTERSPEECH 2023},
        year = {2023}
      }
  - key: bredin2023pyannote
    bibtex: |
      @inproceedings{bredin2023pyannote,
        author = {Bredin, Herv{\'e}},
        title = {{pyannote.audio} 2.1 speaker diarization pipeline: principle, benchmark, and recipe},
        booktitle = {Proc. INTERSPEECH 2023},
        year = {2023}
      }
