name: scene_detection
display_name: PySceneDetect + CLIP
title: "Scenes: cuts and settings"
summary: >-
  Finds where the video cuts from one shot to another and labels the kind of setting each scene shows.
homepage: https://www.scenedetect.com/
benchmarks: []
quality_note: >-
  Neither PySceneDetect nor CLIP publishes an accuracy figure for finding cuts or labelling scene settings.
description: Detect hard cuts and scene boundaries using PySceneDetect with semantic labeling via CLIP.
pipeline_family: scene
variant: pyscenedetect-clip
module_path: videoannotator.pipelines.scene_detection:SceneDetectionPipeline
requires_extras: [scene]
tasks:
  - scene-detection
  - scene-segmentation
modalities:
  - video
capabilities:
  - batch
  - embedding
outputs:
  - format: JSON
    types: [scene_boundary, scene_category]
    file: scene_detection.json
config_schema:
  threshold:
    group: technical
    label: "Cut sensitivity (content score)"
    min: 0
    type: float
    default: 30.0
    description: Scene cut detection threshold
  min_scene_length:
    group: behavioural
    label: "Shortest scene"
    unit: s
    min: 0
    type: float
    default: 1.0
    description: Minimum scene length in seconds
examples:
  - cli: videoannotator job submit demo.mp4 --pipelines scene_detection
    description: Submit scene detection job
version: 1
stability: beta
backends:
  - pytorch

