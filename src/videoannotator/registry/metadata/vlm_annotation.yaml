name: vlm_annotation
display_name: VLM Frame Annotation
title: "Ask AI: your question about each moment"
summary: >-
  Asks a vision-language model your question about frames sampled every few seconds, and records its answer and reasoning for each one.
homepage: https://ollama.com/
benchmarks: []
quality_note: >-
  Depends on the model you choose and on your question, so no figure applies to this pipeline as such. See your model's page, for example https://ollama.com/library/qwen3.5.
description: >
  Classify or describe sampled video frames using a locally-hosted
  vision-language model served by Ollama, driven by a user-supplied prompt.
  Each sample point is one independent, stateless model call — no
  conversation history is carried between frames or bursts.
pipeline_family: vlm
variant: ollama
module_path: videoannotator.pipelines.vlm_annotation:VLMAnnotationPipeline
requires_extras: [llm]
tasks:
  - frame-classification
  - vlm-captioning
modalities:
  - video
capabilities:
  - batch
outputs:
  - format: JSON
    types: [vlm_label, vlm_reasoning]
    file: vlm_annotation.json
config_schema:
  prompt:
    group: behavioural
    label: "Question"
    type: string
    default: |
      Classify as TOUCH only if:
      The mother's hand or arm is actually in physical contact with the infant's body.

      Classify as NO_TOUCH if:
      The mother's hand or arm visually overlaps the infant in the image, but one is clearly in front of or behind the other (the apparent contact is camera perspective, not real contact).
      The mother's hand or arm is near but not actually touching the infant.

      Return ONLY: TOUCH or NO_TOUCH.
    description: >
      The text prompt sent with every sampled frame/burst. Applied
      identically and independently to every sample point in the video.
    widget: textarea
  base_url:
    group: technical
    label: "Model server address"
    type: string
    default: ""
    description: >
      Base URL of the Ollama server. Leave empty to use the server's
      OLLAMA_BASE_URL (default http://127.0.0.1:11434; from a container with
      Ollama on the host, http://host.docker.internal:11434).
  model:
    group: technical
    label: "Model"
    type: string
    default: "qwen3.5:9b"
    description: Ollama model name/tag to use (must already be pulled).
  sampling_mode:
    group: behavioural
    label: "Frames per sample"
    type: string
    default: "single_frame"
    description: >
      "single_frame" sends one image per sample point. "frame_burst" sends a
      window of several frames (see burst_offsets) together in one call, for
      comparing single-static-frame vs short-burst-context predictions.
    enum: [single_frame, frame_burst]
  frame_interval_sec:
    group: behavioural
    label: "Sample every"
    unit: s
    type: float
    default: 5.0
    description: Seconds between sample points.
  start_sec:
    group: technical
    label: "From"
    unit: s
    min: 0
    type: float
    default: 0.0
    description: First sample point, in seconds from the start of the video.
  end_sec:
    group: technical
    label: "To"
    unit: s
    min: 0
    type: float
    default: null
    description: >
      Last possible sample point, in seconds. Leave empty for the end of the
      video.
  moments_sec:
    group: technical
    label: "Only at these moments"
    type: list
    default: null
    description: >
      Seconds to sample at, e.g. [12, 47, 90]. When set, replaces "Sample
      every", "From" and "To"; moments outside the video are left out.
  burst_spacing_sec:
    group: behavioural
    label: "Frames apart"
    unit: s
    applies_when:
      sampling_mode: [frame_burst]
    type: float
    default: null
    description: >
      Seconds between the frames of one sample. Leave empty to use "Sample
      every", as before this setting existed.
  burst_offsets:
    group: technical
    label: "Burst frame offsets"
    applies_when:
      sampling_mode: [frame_burst]
    type: list
    default: [-2, -1, 0, 1, 2]
    description: >
      Offsets around each anchor point, in multiples of the frame spacing
      (the sample interval unless Frames apart is set), used only when
      sampling_mode is "frame_burst".
  think:
    group: technical
    label: "Thinking mode"
    type: boolean
    default: false
    description: >
      Request the model's internal-monologue/thinking mode. Much slower
      (~50x); diagnostic use only, not for production sweeps.
  request_timeout_sec:
    group: technical
    label: "Time limit per answer"
    unit: s
    min: 1
    type: integer
    default: 240
    description: Per-request timeout in seconds.
  keep_alive:
    group: technical
    label: "Keep the model loaded for"
    type: string
    default: "2h"
    description: Ollama keep_alive duration for the loaded model.
examples:
  - cli: videoannotator job submit video.mp4 --pipelines vlm_annotation
    description: Run the default touch-detection prompt at the default 5s cadence, single-frame mode
version: 1
stability: experimental
backends:
  - ollama

# spec 011: needs a reachable Ollama with a model pulled.
requires_setup:
  - kind: service
    name: ollama
    description: A running Ollama server with a vision model pulled
    help_url: https://ollama.com/download

# spec 025: cited by the methods paragraph (videoannotator export methods).
citations:
  - key: ollama
    bibtex: |
      @software{ollama,
        title = {Ollama},
        url = {https://github.com/ollama/ollama}
      }
