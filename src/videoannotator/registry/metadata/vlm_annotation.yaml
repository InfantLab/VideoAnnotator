name: vlm_annotation
display_name: Ask AI
title: "Ask AI: your question about each moment"
summary: >-
  Asks a vision-language model your question about frames sampled every few seconds, and records its answer and reasoning for each one.
homepage: https://github.com/InfantLab/VideoAnnotator/blob/master/docs/development/vlm_annotation_pipeline.md
benchmarks: []
quality_note: >-
  Depends on the model you choose and on your question, so no figure applies to this pipeline as such. See your model's page, for example https://ollama.com/library/qwen3.5.
description: >
  Classify or describe sampled video frames using a vision-language model on
  a model server: Ollama, or an OpenAI-compatible server such as llama.cpp,
  vLLM or LM Studio. Driven by a user-supplied prompt, optionally with an
  answer shape that turns each answer into named fields. Each sample point is
  one independent, stateless model call — no conversation history is carried
  between frames, bursts or clips.
pipeline_family: vlm
variant: ollama
module_path: videoannotator.pipelines.vlm_annotation:VLMAnnotationPipeline
requires_extras: [llm]
tasks:
  - frame-classification
  - vlm-captioning
modalities:
  - video
capabilities:
  - batch
outputs:
  - format: JSON
    types: [vlm_label, vlm_reasoning]
    file: vlm_annotation.json
config_schema:
  prompt:
    group: behavioural
    label: "Question"
    type: string
    default: |
      Classify as TOUCH only if:
      The mother's hand or arm is actually in physical contact with the infant's body.

      Classify as NO_TOUCH if:
      The mother's hand or arm visually overlaps the infant in the image, but one is clearly in front of or behind the other (the apparent contact is camera perspective, not real contact).
      The mother's hand or arm is near but not actually touching the infant.

      Return ONLY: TOUCH or NO_TOUCH.
    description: >
      The text prompt sent with every sampled frame/burst. Applied
      identically and independently to every sample point in the video.
    widget: textarea
  answer_shape:
    group: behavioural
    label: "Answer shape"
    type: list
    default: null
    widget: answer_shape
    description: >
      Optional named fields for the answer, each a choice, yes/no, number or
      text, e.g. [{name: touch, kind: yes_no}]. The server is asked for
      answers in this shape and every answer is checked against it; one that
      doesn't fit is recorded as such. Leave empty for a free-text answer.
  backend:
    group: technical
    label: "Model server kind"
    type: string
    default: "ollama"
    description: >
      Ollama, or an OpenAI-compatible server (llama.cpp's llama-server, vLLM,
      LM Studio, SGLang, or a hosted API if this server allows remote ones).
    enum: [ollama, openai_compatible]
    enum_labels:
      ollama: "Ollama"
      openai_compatible: "OpenAI-compatible (llama.cpp, vLLM, LM Studio…)"
  base_url:
    group: technical
    label: "Model server address"
    type: string
    default: ""
    description: >
      Base URL of the model server, as the server documents it (an
      OpenAI-compatible one usually ends in /v1). With Ollama, leave empty to
      use the server's OLLAMA_BASE_URL (default http://127.0.0.1:11434; from a
      container with Ollama on the host, http://host.docker.internal:11434).
      Keys go in Settings → Model servers, never here.
  model:
    group: technical
    label: "Model"
    type: string
    default: "qwen3.5:9b"
    description: >
      The model's name on the model server (with Ollama, already pulled).
  sampling_mode:
    group: behavioural
    label: "Frames per sample"
    type: string
    default: "single_frame"
    description: >
      "single_frame" sends one image per sample point. "frame_burst" sends a
      window of several frames (see burst_offsets) together in one call, for
      comparing single-static-frame vs short-burst-context predictions.
      "clip" sends a short clip around each sample point as video, to servers
      and models that take video (vLLM with a Qwen-VL model).
    enum: [single_frame, frame_burst, clip]
    enum_labels:
      single_frame: "One frame"
      frame_burst: "Several frames"
      clip: "A short clip"
  clip_length_sec:
    group: technical
    label: "Clip length"
    unit: s
    min: 0.1
    applies_when:
      sampling_mode: [clip]
    type: float
    default: 2.0
    description: >
      Seconds of video around each sample point, half before and half after;
      shortened at the start and end of the video.
  clip_fps:
    group: technical
    label: "Clip frames per second"
    min: 0.1
    applies_when:
      sampling_mode: [clip]
    type: float
    default: 4.0
    description: Frames per second read from the video for each clip.
  frame_interval_sec:
    group: behavioural
    label: "Sample every"
    unit: s
    type: float
    default: 5.0
    description: Seconds between sample points.
  start_sec:
    group: technical
    label: "From"
    unit: s
    min: 0
    type: float
    default: 0.0
    description: First sample point, in seconds from the start of the video.
  end_sec:
    group: technical
    label: "To"
    unit: s
    min: 0
    type: float
    default: null
    description: >
      Last possible sample point, in seconds. Leave empty for the end of the
      video.
  moments_sec:
    group: technical
    label: "Only at these moments"
    type: list
    default: null
    description: >
      Seconds to sample at, e.g. [12, 47, 90]. When set, replaces "Sample
      every", "From" and "To"; moments outside the video are left out.
  burst_spacing_sec:
    group: behavioural
    label: "Frames apart"
    unit: s
    applies_when:
      sampling_mode: [frame_burst]
    type: float
    default: null
    description: >
      Seconds between the frames of one sample. Leave empty to use "Sample
      every", as before this setting existed.
  burst_offsets:
    group: technical
    label: "Burst frame offsets"
    applies_when:
      sampling_mode: [frame_burst]
    type: list
    default: [-2, -1, 0, 1, 2]
    description: >
      Offsets around each anchor point, in multiples of the frame spacing
      (the sample interval unless Frames apart is set), used only when
      sampling_mode is "frame_burst".
  think:
    group: technical
    label: "Thinking mode"
    type: boolean
    default: false
    description: >
      Request the model's internal-monologue/thinking mode. Much slower
      (~50x); diagnostic use only, not for production sweeps.
  request_timeout_sec:
    group: technical
    label: "Time limit per answer"
    unit: s
    min: 1
    type: integer
    default: 240
    description: Per-request timeout in seconds.
  keep_alive:
    group: technical
    label: "Keep the model loaded for"
    type: string
    default: "2h"
    description: >
      Ollama keep_alive duration for the loaded model. Not used by
      OpenAI-compatible servers, which keep their own models loaded.
examples:
  - cli: videoannotator job submit video.mp4 --pipelines vlm_annotation
    description: Run the default touch-detection prompt at the default 5s cadence, single-frame mode
version: 1
stability: experimental
backends:
  - ollama
  - openai_compatible

# spec 011: needs a reachable model server with a model; readiness checks the
# default Ollama one.
requires_setup:
  - kind: service
    name: ollama
    description: >-
      A running Ollama server with a vision model pulled, or another model
      server added in Settings → Model servers
    help_url: https://ollama.com/download

# spec 025: cited by the methods paragraph (videoannotator export methods).
citations:
  - key: ollama
    bibtex: |
      @software{ollama,
        title = {Ollama},
        url = {https://github.com/ollama/ollama}
      }
