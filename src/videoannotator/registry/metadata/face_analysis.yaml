name: face_analysis
display_name: DeepFace
title: "Faces: where they are and their expression"
summary: >-
  Finds faces in each sampled frame and estimates each face's expression. Can also estimate age and gender, which are off by default.
homepage: https://github.com/serengil/deepface
benchmarks:
  - name: "WIDER FACE (hard)"
    measure: "AP"
    figure: "91.4%"
    source: https://arxiv.org/abs/1905.00641
    note: "RetinaFace, the face detector used here"
  - name: "DeepFace age model"
    measure: "MAE"
    figure: "± 4.65"
    source: https://github.com/serengil/deepface
    note: "test data not named in the README"
  - name: "DeepFace gender model"
    measure: "accuracy"
    figure: "97.44%"
    source: https://github.com/serengil/deepface
    note: "test data not named in the README"
quality_note: >-
  None of these figures is for infants or young children. DeepFace's expression model was trained on adult faces, and DeepFace publishes no accuracy figure for it.
description: Face detection (RetinaFace) and expression recognition using DeepFace, with optional age and gender estimation, producing COCO format output.
pipeline_family: face
variant: deepface
family_default: true
module_path: videoannotator.pipelines.face_analysis:FaceAnalysisPipeline
requires_extras: [face]
tasks:
  - face-detection
  - emotion-recognition
  - age-estimation
  - gender-prediction
modalities:
  - video
capabilities:
  - person-linking
  - frame-level-analysis
outputs:
  - format: COCO
    types: [face_detections, emotions, demographics]
    file: face_detections.json
config_schema:
  detection_backend:
    group: technical
    label: "Face detector"
    type: string
    default: deepface
    description: Face detection backend (opencv, deepface, ssd, dlib, mtcnn, retinaface)
  emotion_backend:
    group: technical
    label: "Expression model"
    type: string
    default: deepface
    description: Emotion analysis backend (deepface, disabled)
  confidence_threshold:
    group: technical
    label: "Detection confidence"
    min: 0
    max: 1
    type: float
    default: 0.7
    description: Minimum confidence threshold for face detection
  min_face_size:
    group: behavioural
    label: "Smallest face"
    unit: px
    min: 1
    type: integer
    default: 30
    description: Minimum face size in pixels
  max_faces:
    group: behavioural
    label: "Most faces per frame"
    unit: faces
    min: 1
    type: integer
    default: 10
    description: Maximum number of faces to detect per frame
  scale_factor:
    group: technical
    label: "Haar cascade scale factor"
    applies_when:
      detection_backend: [opencv]
    type: float
    default: 1.1
    description: Scale factor for OpenCV Haar cascades
  min_neighbors:
    group: technical
    label: "Haar cascade neighbours"
    applies_when:
      detection_backend: [opencv]
    type: integer
    default: 5
    description: Minimum neighbors for OpenCV Haar cascades
  detect_emotions:
    group: behavioural
    label: "Expression"
    type: boolean
    default: true
    description: Enable emotion recognition
  detect_age:
    group: behavioural
    label: "Age"
    type: boolean
    default: false
    description: Enable age estimation (downloads a 540 MB model on first use)
    reason: "Off by default: the model was trained on adult faces and says nothing useful about infants."
    reason_source: https://github.com/serengil/deepface
  detect_gender:
    group: behavioural
    label: "Gender"
    type: boolean
    default: false
    description: Enable gender prediction (downloads a 540 MB model on first use)
    reason: "Off by default: the model was trained on adult faces and says nothing useful about infants."
    reason_source: https://github.com/serengil/deepface
  deepface:
    group: technical
    label: "DeepFace models"
    type: object
    default:
      emotion_model: VGG-Face
      age_gender_model: VGG-Face
      detector_backend: retinaface
      enforce_detection: false
    description: DeepFace-specific configuration
    reason: "RetinaFace detector: 91.4% AP on WIDER FACE's hard set, and the best detector in DeepFace's portfolio by its own account; the earlier OpenCV Haar cascade found no faces in the demo clip."
    reason_source: https://arxiv.org/abs/1905.00641
  person_identity:
    group: technical
    label: "Link faces to people"
    type: object
    default:
      enabled: true
      link_to_persons: true
      iou_threshold: 0.5
      require_person_id: false
    description: Person identity linking configuration
examples:
  - cli: videoannotator job submit demo.mp4 --pipelines face_analysis
    description: Submit face analysis job with default settings
  - cli: videoannotator job submit demo.mp4 --pipelines face_analysis --config '{"face_analysis":{"detect_emotions":true,"max_faces":5}}'
    description: Analyze up to 5 faces with emotions
  - api: |
      {
        "video_url": "demo.mp4",
        "pipelines": ["face_analysis"],
        "config": {
          "face_analysis": {
            "detection_backend": "retinaface",
            "detect_emotions": true,
            "detect_age": true,
            "detect_gender": true
          }
        }
      }
    description: Age and gender switched on as well (off by default), via API
version: 1
stability: stable
backends:
  - tensorflow
  - opencv
requirements:
  packages:
    - deepface
    - opencv-python
# Models DeepFace fetches on first use with the defaults: the `retinaface`
# detector and the expression model (age and gender are off, spec 030).
weights:
  - id: retinaface.h5
    approx_mb: 119
    cache: deepface
  - id: facial_expression_model_weights.h5
    approx_mb: 6
    cache: deepface

# spec 025: cited by the methods paragraph (videoannotator export methods).
citations:
  - key: serengil2026deepface
    bibtex: |
      @article{serengil2026deepface,
        author = {Serengil, Sefik Ilkin and Ozpinar, Alper},
        title = {Boosted {LightFace}: A Hybrid {DNN} and {GBM} Model for Boosted Facial Recognition},
        journal = {Gazi University Journal of Science},
        volume = {39},
        number = {1},
        pages = {452--466},
        year = {2026},
        doi = {10.35378/gujs.1794891}
      }
  - key: deng2020retinaface
    bibtex: |
      @inproceedings{deng2020retinaface,
        author = {Deng, Jiankang and Guo, Jia and Ververas, Evangelos and Kotsia, Irene and Zafeiriou, Stefanos},
        title = {{RetinaFace}: Single-Shot Multi-Level Face Localisation in the Wild},
        booktitle = {Proceedings of the {IEEE/CVF} Conference on Computer Vision and Pattern Recognition ({CVPR})},
        pages = {5203--5212},
        year = {2020}
      }
