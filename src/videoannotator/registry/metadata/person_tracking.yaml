name: person_tracking
display_name: YOLO26 pose
title: "People: where they are and how they move"
summary: >-
  Finds each person in each sampled frame, follows them through the video, and marks 17 body points (nose, shoulders, wrists, knees and so on).
homepage: https://docs.ultralytics.com/tasks/pose/
benchmarks:
  - name: "COCO Keypoints val2017"
    measure: "mAP pose 50-95 (e2e)"
    figure: "57.2"
    source: https://docs.ultralytics.com/models/yolo26/
    note: "yolo26n-pose at 640 px, end-to-end (no NMS); yolo11n-pose, the previous default, 50.0"
description: Track persons with YOLO26 pose + ByteTrack producing COCO person + keypoint annotations.
pipeline_family: person
variant: yolo26n-pose-bytetrack
module_path: videoannotator.pipelines.person_tracking:PersonTrackingPipeline
requires_extras: [person]
tasks:
  - object-tracking
  - pose-estimation
modalities:
  - video
capabilities:
  - real-time
  - identity-persistence
outputs:
  - format: COCO
    types: [person_detection, keypoints, tracking]
    file: person_tracking.json
  - format: JSON
    types: [person_tracks]
    file: person_tracks.json
config_schema:
  model:
    group: technical
    label: "Pose model"
    type: string
    default: models/yolo/yolo26n-pose.pt
    description: >-
      YOLO pose model: a file name Ultralytics knows (e.g. yolo11n-pose.pt, the default before
      v1.6.0) or a path to weights.
    reason: "Higher keypoint accuracy than yolo11n-pose at the same size: COCO pose mAP 50-95 57.2 vs 50.0."
    reason_source: https://docs.ultralytics.com/models/yolo26/
  conf_threshold:
    group: technical
    label: "Detection confidence"
    min: 0
    max: 1
    type: float
    default: 0.4
    description: Detection confidence threshold
  iou_threshold:
    group: technical
    label: "Tracking overlap (IoU)"
    min: 0
    max: 1
    type: float
    default: 0.7
    description: >-
      Overlap above which two detections count as one (non-maximum suppression). No effect with
      YOLO26 models, the default since v1.6.0: they are end to end, with no suppression step.
  track_mode:
    group: behavioural
    label: "Follow each person through the video"
    type: boolean
    default: true
    description: Enable tracking logic
examples:
  - cli: videoannotator job submit demo.mp4 --pipelines person_tracking
    description: Submit person tracking job
  - api: POST /api/v1/jobs (selected_pipelines=["person_tracking"])
    description: API job submission including person tracking
version: 1
stability: beta
backends:
  - pytorch

# spec 025: cited by the methods paragraph (videoannotator export methods).
