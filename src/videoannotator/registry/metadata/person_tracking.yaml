    bibtex: |
      @software{jocher2024yolo11,
        author = {Jocher, Glenn and Qiu, Jing},
        title = {Ultralytics {YOLO11}},
        version = {11.0.0},
        year = {2024},
        url = {https://github.com/ultralytics/ultralytics},
        license = {AGPL-3.0}
      }
  - key: zhang2022bytetrack
    bibtex: |
