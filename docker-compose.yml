services:
  # Development service
  videoannotator-dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - ./data:/app/data
      - ./output:/app/output
    environment:
      - HUGGINGFACE_TOKEN  # passed through from the host env / .env; needed by speaker diarization (pyannote)
      - HF_AUTH_TOKEN  # pre-v1.5.0 name, still read as a fallback
      - PYTHONPATH=/app
      - CUDA_VISIBLE_DEVICES=0
    ports:
      - "8888:8888" # Jupyter
      - "18011:18011" # FastAPI (host 18011 -> container 18011)
    command: ["uv", "run", "videoannotator", "--help"]
    profiles:
      - dev

  # Production service
  videoannotator-prod:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - models:/app/models  # model weights persist across rebuilds (spec 016)
      - database:/app/database  # jobs, users and API keys persist across rebuilds
      - storage:/app/storage  # each job's video and results, which the database points to
      - ./data:/app/data:ro
      - ./output:/app/output
      # Spec 022: your videos, read where they are and never changed...
      - ${VIDEOS_DIR:-./videos}:/videos:ro
      # ...and your results, in a folder on your own machine.
      - ${RESULTS_DIR:-~/VideoAnnotator}:/results
    ports:
      # This machine only: VIDEOANNOTATOR_PUBLISHED_LOCALLY below relies on it.
      # Publishing more widely (e.g. "18011:18011") means removing that line.
      - "127.0.0.1:18011:18011"
    environment:
      - HUGGINGFACE_TOKEN  # passed through from the host env / .env; needed by speaker diarization (pyannote)
      - HF_AUTH_TOKEN  # pre-v1.5.0 name, still read as a fallback
      - VIDEOANNOTATOR_INGEST_ROOTS=/videos
      - VIDEOANNOTATOR_RESULTS_DIR=/results
      - VIDEOANNOTATOR_PUBLISHED_LOCALLY=1  # every caller is this machine: the port is on 127.0.0.1
      - VIDEOANNOTATOR_HOST_PATHS=/videos=${VIDEOS_DIR:-./videos};/results=${RESULTS_DIR:-~/VideoAnnotator}
      - UV_NO_SYNC=1  # keep pipeline extras installed from the viewer across restarts (spec 011 FR-009)
      - PYTHONPATH=/app
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}  # Ollama on the host (vlm_annotation)
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux Docker Engine; Docker Desktop provides it already
    command: ["uv", "run", "videoannotator", "server", "--host", "0.0.0.0", "--port", "18011"]
    profiles:
      - prod

  # GPU-enabled service
  videoannotator-gpu:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - models:/app/models  # model weights persist across rebuilds (spec 016)
      - database:/app/database  # jobs, users and API keys persist across rebuilds
      - storage:/app/storage  # each job's video and results, which the database points to
      - ./data:/app/data:ro
      - ./output:/app/output
      # Spec 022: your videos, read where they are and never changed...
      - ${VIDEOS_DIR:-./videos}:/videos:ro
      # ...and your results, in a folder on your own machine.
      - ${RESULTS_DIR:-~/VideoAnnotator}:/results
    ports:
      # This machine only: VIDEOANNOTATOR_PUBLISHED_LOCALLY below relies on it.
      # Publishing more widely (e.g. "18011:18011") means removing that line.
      - "127.0.0.1:18011:18011"
    environment:
      - HUGGINGFACE_TOKEN  # passed through from the host env / .env; needed by speaker diarization (pyannote)
      - HF_AUTH_TOKEN  # pre-v1.5.0 name, still read as a fallback
      - VIDEOANNOTATOR_INGEST_ROOTS=/videos
      - VIDEOANNOTATOR_RESULTS_DIR=/results
      - VIDEOANNOTATOR_PUBLISHED_LOCALLY=1  # every caller is this machine: the port is on 127.0.0.1
      - VIDEOANNOTATOR_HOST_PATHS=/videos=${VIDEOS_DIR:-./videos};/results=${RESULTS_DIR:-~/VideoAnnotator}
      - UV_NO_SYNC=1  # keep pipeline extras installed from the viewer across restarts (spec 011 FR-009)
      - PYTHONPATH=/app
      - CUDA_VISIBLE_DEVICES=0
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}  # Ollama on the host (vlm_annotation)
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux Docker Engine; Docker Desktop provides it already
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: ["uv", "run", "videoannotator", "server", "--host", "0.0.0.0", "--port", "18011"]
    profiles:
      - gpu

  # Jupyter service for development
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - ./data:/app/data
      - ./output:/app/output
    ports:
      - "8888:8888"
    environment:
      - PYTHONPATH=/app
    # --inexact: .:/app shares the repo's .venv; an exact sync would uninstall
    # pipeline extras installed from the viewer (see scripts/start_server.sh).
    command: ["bash", "-lc", "uv sync --inexact --group notebooks && uv run jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root"]
    profiles:
      - dev

  # Database service (optional, for future use)
  postgres:
    image: postgres:13
    environment:
      - POSTGRES_DB=videoannotator
      - POSTGRES_USER=videoannotator
      - POSTGRES_PASSWORD=videoannotator
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    profiles:
      - db

  # Redis service (optional, for caching)
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    profiles:
      - cache

volumes:
  postgres_data:
  models:
    # Fixed name (not <project>_models), shared with the dev container, so the
    # weights download once per machine.
    name: videoannotator-models
  database:
    name: videoannotator-database
  storage:
    name: videoannotator-storage

networks:
  default:
    name: videoannotator_network
